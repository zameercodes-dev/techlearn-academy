<head>
    <script src="https://cdn.tailwindcss.com"></script>

</head>

<main class=" max-w-4xl mx-auto p-6"> 
    <div class=" flex justify-between items-center mb-6"> 
       <h1 class=" text-2xl font-bold text-gray-900">Available Courses</h1>
       <a href="" class=" bg-purple-900 text-white px-4 py-4 rounded text-sm hover:bg-purple-800">Add Courses </a>
    </div>
    <div class=" grid grid-cols-1 md:grid-cols-2 gap-6 ">
        {% for course in courses %}
        <div class=" bg-white border rounded-lg p-5 shadow-sm"></div>
        <h3 class=" text-lg font-bold text-gray-900 ">{{ course.title}}</h3>
        <p class=" text-gray-600 text-sm mt-2 mb-4 ">{{ course.description}}</p>
        <div class="flex justify-between items-center text-xs text-gray-500 border-t pt-3">
            <span> duration:{{course.duration}} weeks </span>
            <span class="font-semibold text-purple-900">Active</span>
        </div>
            {% empty %}
    <p>No Courses Available Yet </p>
    {% endfor %}
    </div>


</main>
